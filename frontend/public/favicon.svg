<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="arcCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#0077FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#050A14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hudCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <linearGradient id="hudAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Base -->
  <rect width="120" height="120" rx="24" fill="#050A14" />

  <!-- Outer Tactical Ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="18 6 4 6" />
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#hudCyan)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="40 12" />

  <!-- Outer Hexagon Frame -->
  <polygon points="60,14 100,37 100,83 60,106 20,83 20,37" fill="rgba(0, 240, 255, 0.05)" stroke="url(#hudCyan)" stroke-width="2.2" filter="url(#glow)" />

  <!-- Amber Tactical TelemetryTicks -->
  <path d="M60 6 L60 12 M60 108 L60 114 M6 60 L12 60 M108 60 L114 60" stroke="url(#hudAmber)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M22 22 L27 27 M98 22 L93 27 M22 98 L27 93 M98 98 L93 93" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" />

  <!-- Circuit TelemetryTraces -->
  <path d="M60 14 L60 28 M100 37 L88 44 M100 83 L88 76 M60 106 L60 92 M20 83 L32 76 M20 37 L32 44" stroke="#00F0FF" stroke-width="1.8" stroke-opacity="0.8" />

  <!-- Inner Segmented Arc Reactor Ring -->
  <circle cx="60" cy="60" r="32" fill="none" stroke="#00F0FF" stroke-width="4" stroke-dasharray="11 5.7" stroke-opacity="0.9" filter="url(#glow)" />
  <circle cx="60" cy="60" r="24" fill="none" stroke="#FF9E00" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.85" />

  <!-- Inner Geometric Hexagon Core -->
  <polygon points="60,38 79,49 79,71 60,82 41,71 41,49" fill="url(#arcCore)" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Center M Emblem / Reactor Heart -->
  <path d="M49 67 L49 53 L60 61 L71 53 L71 67" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="60" cy="60" r="3.5" fill="#FFFFFF" filter="url(#glow)" />
</svg>
